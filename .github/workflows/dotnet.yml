# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: 
    - "main"
    - "dev"
    - "CI-test"
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Install headless GL stack
      run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libglfw3 libx11-6 libxcursor1 libxi6 libxrandr2 libxinerama1
    - name: Test ECS.Tests
      id: ecs_tests
      run: dotnet test tests/ECS.Tests/ECS.Tests.csproj --no-build --verbosity normal
    # Silk.NET Assimp/GLFW only probe system paths on Linux; point at NuGet natives under bin.
    - name: Test Engine.Tests
      id: engine_tests
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/tests/Engine.Tests/bin/Debug/net10.0/runtimes/linux-x64/native
      run: dotnet test tests/Engine.Tests/Engine.Tests.csproj --no-build --verbosity normal --logger "trx;LogFileName=engine-tests.trx"
    - name: Test Editor.Tests
      id: editor_tests
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/tests/Editor.Tests/bin/Debug/net10.0/runtimes/linux-x64/native
      run: dotnet test tests/Editor.Tests/Editor.Tests.csproj --no-build --verbosity normal --logger "trx;LogFileName=editor-tests.trx"
    - name: Test Engine.GraphicsTests
      id: graphics_tests
      if: hashFiles('tests/Engine.GraphicsTests/Engine.GraphicsTests.csproj') != ''
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe
      run: xvfb-run -a dotnet test tests/Engine.GraphicsTests/Engine.GraphicsTests.csproj --no-build --verbosity normal --logger "trx;LogFileName=graphics-tests.trx"
    - name: Test results
      if: always()
      run: echo "ECS.Tests=${{ steps.ecs_tests.outcome }} Engine.Tests=${{ steps.engine_tests.outcome }} Editor.Tests=${{ steps.editor_tests.outcome }} Engine.GraphicsTests=${{ steps.graphics_tests.outcome }}"
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: "**/*.trx"
