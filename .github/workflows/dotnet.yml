# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: 
    - "main"
    - "dev"
    - "CI-test"
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Install headless GL stack
      run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglx-mesa0
    - name: Test ECS.Tests
      id: ecs_tests
      continue-on-error: true
      run: dotnet test tests/ECS.Tests/ECS.Tests.csproj --no-build --verbosity normal
    - name: Test Engine.Tests
      id: engine_tests
      continue-on-error: true
      run: dotnet test tests/Engine.Tests/Engine.Tests.csproj --no-build --verbosity normal
    - name: Test Engine.GraphicsTests
      id: graphics_tests
      continue-on-error: true
      if: hashFiles('tests/Engine.GraphicsTests/Engine.GraphicsTests.csproj') != ''
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe
      run: xvfb-run -a dotnet test tests/Engine.GraphicsTests/Engine.GraphicsTests.csproj --no-build --verbosity normal
    - name: Test summary
      if: always()
      shell: bash
      run: |
        ecs="${{ steps.ecs_tests.outcome }}"
        engine="${{ steps.engine_tests.outcome }}"
        graphics="${{ steps.graphics_tests.outcome }}"
        echo "ECS.Tests:            $ecs"
        echo "Engine.Tests:         $engine"
        echo "Engine.GraphicsTests: $graphics"
        if [ "$ecs" != "success" ] || [ "$engine" != "success" ]; then exit 1; fi
        if [ "$graphics" != "skipped" ] && [ "$graphics" != "success" ]; then exit 1; fi
        exit 0
